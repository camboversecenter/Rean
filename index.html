<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REAN - រៀន | Learn by Doing</title>

    <!-- Primary Meta Tags -->
    <meta
      name="description"
      content="REAN is a free educational marketplace for Cambodia, connecting students with schools, tutors, and AI-driven learning missions. Learn by doing, join a gamified community, and grow your skills."
    />
    <meta name="theme-color" content="#0F766E" />

    <!-- PWA: installable to the home screen, works on flaky connections -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="REAN" />

    <!-- Open Graph / social sharing. Site: https://rean.camboverse.world -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="REAN" />
    <meta property="og:locale" content="km_KH" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://rean.camboverse.world/" />
    <meta property="og:title" content="REAN | Learn by Doing" />
    <meta
      property="og:description"
      content="A free educational marketplace for Cambodia: schools, tutors, and AI-driven learning missions. Learn by doing and join a gamified community."
    />
    <meta property="og:image" content="https://rean.camboverse.world/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="REAN - Learn by doing. Educational marketplace for Cambodia."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="REAN | Learn by Doing" />
    <meta
      name="twitter:description"
      content="A free educational marketplace for Cambodia: schools, tutors, and AI-driven learning missions."
    />
    <meta name="twitter:image" content="https://rean.camboverse.world/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Base styles that Tailwind might not catch immediately in JIT if dynamic classes are tricky */
      body {
        font-family: 'Kantumruy Pro', sans-serif;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
    <!-- Pyodide for Client-Side Python Execution (used by CodeEditor) -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <script>
      // Applies the saved theme before the first paint. Without this the page
      // renders light and then snaps to dark once React mounts, which reads as
      // a flash on every navigation. Kept inline and dependency free so it runs
      // before the bundle is even fetched.
      // The key and the light default must match components/ThemeProvider.tsx.
      (function () {
        try {
          if (localStorage.getItem('rean-theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* private mode: fall through to light */
        }
      })();
    </script>
  </head>
  <body class="bg-surface-2 text-content-soft">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
