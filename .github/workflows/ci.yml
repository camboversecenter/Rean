name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  # Job 1: Code Quality and Testing
  test-and-lint:
    name: Run Linting and Tests
    runs-on: ubuntu-latest
    steps:
      # Step 1: Download the repository code into the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up the Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # This automatically caches node_modules to speed up runs!

      # Step 3: Install dependencies (using clean install for reliable builds)
      - name: Install Dependencies
        run: npm ci

      # Step 4: Check Code Formatting (fails on unformatted files)
      - name: Check Formatting
        run: npm run format:check

      # Step 5: Run Linter (Type Checking)
      - name: Run Linter
        run: npm run lint

      # Step 6: Run Unit Tests
      - name: Run Tests
        run: npm run test

  # Job 2: Build the Application
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test-and-lint # This is the magic keyword!

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

  # NOTE: Deployment is handled by Cloudflare Pages' own Git integration
  # (connected in the Cloudflare dashboard), which builds and deploys on every
  # push to main and creates preview URLs for other branches. There is no
  # deploy job here on purpose: a GitHub Actions deploy step would duplicate
  # that and requires CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets.
