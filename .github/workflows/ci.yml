name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  # Job 1: Code Quality and Testing
  test-and-lint:
    name: Run Linting and Tests
    runs-on: ubuntu-latest
    steps:
      # Step 1: Download the repository code into the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up the Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # This automatically caches node_modules to speed up runs!

      # Step 3: Install dependencies (using clean install for reliable builds)
      - name: Install Dependencies
        run: npm ci

      # Step 4: Check Code Formatting
      - name: Check Formatting
        run: npm run format

      # Step 5: Run Linter (Type Checking)
      - name: Run Linter
        run: npm run lint

      # Step 6: Run Unit Tests
      - name: Run Tests
        run: npm run test

  # Job 2: Build the Application
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test-and-lint # This is the magic keyword!
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          # We pass dummy environment variables so Vite can build successfully
          API_KEY: "dummy-key-for-build"

      # Step 5: Upload the built artifact so the next job can use it
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-folder
          path: dist/

  # Job 3: Deploy to Cloudflare Pages
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-folder
          path: dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'rean-marketplace'
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # This is where the magic happens for Real Industry Practices:
          # If it is the main branch, deploy to production.
          # If it is any other branch, create a temporary preview environment!
          branch: ${{ github.ref_name }}
